<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RT2 Kerstbomen – Bestelling</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14382b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 6 16h5l-6 8h22l-6-8h5z' fill='%2314382b'/%3E%3Crect x='14' y='24' width='4' height='5' fill='%23b3322a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="./">
    <img id="logo" alt="RT2" width="44" height="44">
    <span>RT2</span>
  </a>
  <div class="lang" role="group" aria-label="Taal / Langue">
    <button type="button" data-lang="nl" aria-pressed="true">NL</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
  </div>
</header>

<main class="status-page">
  <div class="card center" id="box" aria-live="polite">
    <div class="badge wait" id="badge"><span class="spinner"></span></div>
    <h2 id="title" data-t="waitTitle">Even geduld…</h2>
    <p class="sub" id="text" data-t="waitText">We controleren je betaling bij Mollie.</p>

    <dl class="details" id="details" hidden>
      <div><dt data-t="dNr">Bestelnummer</dt><dd id="dNr"></dd></div>
      <div><dt data-t="dQty">Aantal bomen</dt><dd id="dQty"></dd></div>
      <div><dt data-t="dTotal">Betaald</dt><dd id="dTotal"></dd></div>
    </dl>

    <a class="btn" id="againBtn" href="./" hidden><span data-t="again">Opnieuw proberen</span></a>
    <a class="btn secondary" id="homeBtn" href="./" hidden><span data-t="home">Terug naar de website</span></a>
    <div class="contact" id="contact" hidden>
      <a id="mailLink"></a>
    </div>
  </div>
</main>

<script src="i18n.js"></script>
<script>
(function () {
  const C = window.RT2_CONFIG;
  const $ = id => document.getElementById(id);
  $('logo').src = C.LOGO_URL;
  $('mailLink').href = 'mailto:' + C.CONTACT_EMAIL;
  $('mailLink').textContent = '✉️  ' + C.CONTACT_EMAIL;

  const ref = new URLSearchParams(location.search).get('ref');
  let state = 'wait';
  let last = null;

  const VIEWS = {
    wait:    { badge: 'wait', icon: '<span class="spinner"></span>', title: 'waitTitle', text: 'waitText' },
    paid:    { badge: 'ok',   icon: '✓', title: 'paidTitle',    text: 'paidText' },
    pending: { badge: 'warn', icon: '⏳', title: 'pendingTitle', text: 'pendingText' },
    failed:  { badge: 'err',  icon: '✕', title: 'failTitle',    text: 'failText' },
    unknown: { badge: 'warn', icon: '?', title: 'unknownTitle', text: 'unknownText' }
  };

  function show(s, data) {
    state = s; if (data) last = data;
    const v = VIEWS[s];
    $('badge').className = 'badge ' + v.badge;
    $('badge').innerHTML = v.icon;
    $('title').dataset.t = v.title; $('title').textContent = RT2_I18N.t(v.title);
    $('text').dataset.t = v.text;   $('text').textContent = RT2_I18N.t(v.text);
    $('details').hidden = s !== 'paid';
    $('againBtn').hidden = s !== 'failed';
    $('homeBtn').hidden = s === 'wait' || s === 'failed';
    $('contact').hidden = s !== 'unknown' && s !== 'pending';
    if (s === 'paid' && last) {
      $('dNr').textContent = last.orderNumber;
      $('dQty').textContent = last.quantity;
      $('dTotal').textContent = '€ ' + Number(last.total).toFixed(2).replace('.', ',');
    }
  }
  document.addEventListener('langchange', () => show(state));

  if (!ref) { document.addEventListener('DOMContentLoaded', () => show('unknown')); return; }

  let tries = 0;
  async function poll() {
    tries++;
    try {
      const res = await fetch(C.APPS_SCRIPT_URL + '?action=status&ref=' + encodeURIComponent(ref));
      const d = await res.json();
      if (d.status === 'paid') { try { localStorage.removeItem('rt2-draft'); } catch (e) {} return show('paid', d); }
      if (['canceled', 'expired', 'failed'].includes(d.status)) return show('failed', d);
      // 'open' na terugkeer van Mollie = betaling niet afgerond (geannuleerd / venster gesloten)
      if (d.status === 'open' && tries >= 2) return show('failed', d);
      if (d.status === 'unknown' && tries >= 3) return show('unknown');
    } catch (e) { console.warn(e); }
    if (tries < 12) setTimeout(poll, 2500);   // ± 30 seconden
    else show('pending');
  }
  poll();
})();
</script>
</body>
</html>
